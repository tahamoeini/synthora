name: Format review branch once

on:
  push:
    branches:
      - chatgpt/launch-hardening-2026-10-02

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/launch-hardening-2026-10-02

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize formatting
        run: npm run format

      - name: Remove one-time workflow
        run: rm .github/workflows/format-review-branch.yml

      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: normalize repository formatting"
          git push origin HEAD:chatgpt/launch-hardening-2026-10-02
